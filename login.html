<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FCMB Data Science — Secure sign-in portal">
  <title>Data Science — Sign In</title>

  <!-- Bootstrap 4 -->
  <link rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

  <!-- Font Awesome 5 -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

  <!-- Google Fonts — Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

  <style>
    /* =============================================
       10m — CSS Design Tokens & Reset
       ============================================= */

    :root {
      --brand:        #5d2185;
      --brand-dark:   #481767;
      --brand-light:  #ddd0ea;
      --brand-glow:   rgba(93, 33, 133, 0.12);
      --accent-gold:  #f0c94a;
      --text:         #24364b;
      --text-muted:   #8290a5;
      --border:       #cfd6df;
      --bg:           #ffffff;
      --card-shadow:  0 8px 32px rgba(93, 33, 133, 0.10);
      --radius:       6px;
      --transition:   0.18s ease;
      --font-body:    'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-serif:   Georgia, 'Times New Roman', serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }

    /* =============================================
       20m — Page Layout & Brand Header
       ============================================= */

    /* --- Full-page flex column wrapper --- */
    .login-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* --- Brand header --- */
    .brand {
      padding-top: 40px;
      text-align: center;
      font-family: var(--font-serif);
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text);
    }

    /* Brand icon badge */
    .brand-mark {
      display: inline-flex;
      width: 31px;
      height: 31px;
      margin-right: 7px;
      vertical-align: -7px;
      align-items: center;
      justify-content: center;
      background: var(--brand);
      border-radius: 2px;
      color: #fff;
      font-size: 8px;
      line-height: 1;
      position: relative;
      overflow: hidden;
    }

    /* Gold accent bar at bottom of badge */
    .brand-mark::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 6px;
      background: var(--accent-gold);
    }

    .brand-mark span {
      position: relative;
      z-index: 2;
      margin-top: -5px;
      font-family: Arial, sans-serif;
      font-weight: 700;
      letter-spacing: 0;
    }

    /* --- Login content area (centre card vertically) --- */
    .login-area {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 230px 20px 80px;
    }

    /* Card container — constrained width */
    .login-card {
      width: 100%;
      max-width: 352px;
    }

    /* --- Footer --- */
    .footer {
      padding: 0 20px 42px;
      text-align: center;
      color: #425873;
      font-family: var(--font-serif);
      font-size: 14px;
    }

    .footer strong {
      font-weight: 700;
    }

    /* --- Responsive --- */
    @media (max-width: 576px) {
      .brand {
        padding-top: 25px;
      }

      .login-area {
        padding-top: 120px;
        padding-bottom: 50px;
      }

      .login-card {
        max-width: 360px;
      }

      .footer {
        padding-bottom: 25px;
      }
    }
  </style>
</head>

<body>
  <main class="login-page">

    <!-- Brand header -->
    <header class="brand" aria-label="Data Science">
      <span class="brand-mark"><span>FCMB</span></span>
      <span>Data Science</span>
    </header>

    <!-- Login content area -->
    <section class="login-area">
      <div class="login-card">
        <!-- form goes here -->
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      &copy; 2026 Designed &amp; Developed by <strong>Data Science</strong>
    </footer>

  </main>

  <!-- Bootstrap 4 JS bundle -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</html>

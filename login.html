<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FCMB Data Science — Secure sign-in portal">
  <title>Data Science — Sign In</title>

  <!-- External dependencies -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Shared CSS barrel (variables → base → layout → components → pages/login) -->
  <link rel="stylesheet" href="css/main.css">
</head>

<!-- data-page="login" tells app.js to boot FCMB.Login -->
<body data-page="login">
  <main class="login-page">

    <!-- Brand header -->
    <header class="login-brand" aria-label="Data Science">
      <span class="login-brand-mark"><span>FCMB</span></span>
      <span>Data Science</span>
    </header>

    <!-- Login card area -->
    <section class="login-area">
      <div class="login-card">

        <h1 class="login-title">Sign In</h1>
        <p class="login-subtitle" id="loginSubtitle">
          Enter your work email to continue
        </p>

        <!-- Profile avatar -->
        <div class="profile-icon" aria-hidden="true">
          <i class="fas fa-user"></i>
        </div>

        <!-- Two-step login form -->
        <form id="loginForm" novalidate>

          <!-- Step 1 — Email -->
          <div class="form-group" id="emailGroup">
            <label class="form-label" for="email">Work Email</label>
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              placeholder="name@company.com"
              autocomplete="username"
              required
            >
            <div class="invalid-feedback">
              Please enter a valid work email.
            </div>
          </div>

          <!-- Step 2 — Password (hidden until Continue clicked) -->
          <div class="password-group" id="passwordGroup">
            <div class="form-group">
              <label class="form-label" for="password">Password</label>
              <div class="password-wrap">
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  name="password"
                  placeholder="Enter your password"
                  autocomplete="current-password"
                >
                <button
                  type="button"
                  class="toggle-password"
                  id="togglePassword"
                  aria-label="Show password"
                >
                  <i class="fas fa-eye"></i>
                </button>
              </div>
              <div class="invalid-feedback">
                Please enter your password (min 6 characters).
              </div>
            </div>

            <div class="forgot-row">
              <a href="#" class="forgot-link" id="forgotPassword">Forgot password?</a>
            </div>
          </div>

          <!-- CTA — label controlled by FCMB.Login JS module -->
          <button type="submit" class="btn-login" id="loginButton">
            Continue
          </button>

        </form>
      </div>
    </section>

    <!-- Footer -->
    <footer class="login-footer">
      &copy; 2026 Designed &amp; Developed by <strong>Data Science</strong>
    </footer>

  </main>

  <!-- Bootstrap 4 JS -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

  <!-- FCMB JS architecture (namespace → utils → modules → app) -->
  <script src="js/namespace.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/modules/Login.js"></script>
  <script src="js/app.js"></script>

</body>
</html>

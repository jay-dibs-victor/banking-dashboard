<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FCMB Data Science — Secure sign-in portal">
  <title>Data Science — Sign In</title>

  <!-- Bootstrap 4 -->
  <link rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

  <!-- Font Awesome 5 -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

  <!-- Google Fonts — Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

  <style>
    /* =============================================
       10m MILESTONE — CSS Design Tokens & Reset
       ============================================= */

    :root {
      --brand:        #5d2185;
      --brand-dark:   #481767;
      --brand-light:  #ddd0ea;
      --brand-glow:   rgba(93, 33, 133, 0.12);
      --accent-gold:  #f0c94a;
      --text:         #24364b;
      --text-muted:   #8290a5;
      --border:       #cfd6df;
      --bg:           #ffffff;
      --card-shadow:  0 8px 32px rgba(93, 33, 133, 0.10);
      --radius:       6px;
      --transition:   0.18s ease;
      --font-body:    'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-serif:   Georgia, 'Times New Roman', serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>

<body>
  <!-- markup goes here -->
</body>

<!-- Bootstrap 4 JS bundle -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</html>

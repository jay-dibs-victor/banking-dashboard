<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FCMB Data Science — Secure sign-in portal">
  <title>Data Science — Sign In</title>

  <!-- Bootstrap 4 -->
  <link rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

  <!-- Font Awesome 5 -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

  <!-- Google Fonts — Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

  <style>
    /* =============================================
       10m — CSS Design Tokens & Reset
       ============================================= */

    :root {
      --brand:        #5d2185;
      --brand-dark:   #481767;
      --brand-light:  #ddd0ea;
      --brand-glow:   rgba(93, 33, 133, 0.12);
      --accent-gold:  #f0c94a;
      --text:         #24364b;
      --text-muted:   #8290a5;
      --border:       #cfd6df;
      --bg:           #ffffff;
      --card-shadow:  0 8px 32px rgba(93, 33, 133, 0.10);
      --radius:       6px;
      --transition:   0.18s ease;
      --font-body:    'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-serif:   Georgia, 'Times New Roman', serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }

    /* =============================================
       20m — Page Layout & Brand Header
       ============================================= */

    .login-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .brand {
      padding-top: 40px;
      text-align: center;
      font-family: var(--font-serif);
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text);
    }

    .brand-mark {
      display: inline-flex;
      width: 31px;
      height: 31px;
      margin-right: 7px;
      vertical-align: -7px;
      align-items: center;
      justify-content: center;
      background: var(--brand);
      border-radius: 2px;
      color: #fff;
      font-size: 8px;
      line-height: 1;
      position: relative;
      overflow: hidden;
    }

    .brand-mark::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 6px;
      background: var(--accent-gold);
    }

    .brand-mark span {
      position: relative;
      z-index: 2;
      margin-top: -5px;
      font-family: Arial, sans-serif;
      font-weight: 700;
      letter-spacing: 0;
    }

    .login-area {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 230px 20px 80px;
    }

    .login-card {
      width: 100%;
      max-width: 352px;
    }

    .footer {
      padding: 0 20px 42px;
      text-align: center;
      color: #425873;
      font-family: var(--font-serif);
      font-size: 14px;
    }

    .footer strong {
      font-weight: 700;
    }

    /* =============================================
       30m — Form Structure Styles
       ============================================= */

    /* Profile avatar */
    .profile-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 28px;
      border: 6px solid var(--brand-light);
      border-radius: 50%;
      background: var(--brand);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 29px;
    }

    /* Card title & subtitle */
    .login-title {
      margin: 0 0 8px;
      text-align: center;
      font-family: var(--font-serif);
      font-size: 19px;
      font-weight: 700;
      color: #26394e;
    }

    .login-subtitle {
      margin: 0 0 37px;
      text-align: center;
      color: #8190a5;
      font-size: 14px;
    }

    /* Form fields */
    .form-group {
      margin-bottom: 19px;
    }

    .form-label {
      display: block;
      margin-bottom: 9px;
      color: #26394e;
      font-size: 14px;
      font-weight: 600;
    }

    /* Password field wrapper (for toggle icon) */
    .password-wrap {
      position: relative;
    }

    .password-wrap .form-control {
      padding-right: 42px;
    }

    /* Forgot password row */
    .forgot-row {
      text-align: right;
      margin-top: -8px;
      margin-bottom: 19px;
    }

    .forgot-link {
      color: var(--brand);
      font-size: 12px;
      text-decoration: none;
    }

    /* Validation message */
    .invalid-feedback {
      font-size: 12px;
    }

    /* Responsive */
    @media (max-width: 576px) {
      .brand       { padding-top: 25px; }
      .login-area  { padding-top: 120px; padding-bottom: 50px; }
      .login-card  { max-width: 360px; }
      .footer      { padding-bottom: 25px; }
    }
  </style>
</head>

<body>
  <main class="login-page">

    <!-- Brand header -->
    <header class="brand" aria-label="Data Science">
      <span class="brand-mark"><span>FCMB</span></span>
      <span>Data Science</span>
    </header>

    <!-- Login content area -->
    <section class="login-area">
      <div class="login-card">

        <h1 class="login-title">Sign In</h1>
        <p class="login-subtitle">Enter your work email and password to proceed</p>

        <!-- Profile avatar -->
        <div class="profile-icon" aria-hidden="true">
          <i class="fas fa-user"></i>
        </div>

        <!-- Login form -->
        <form id="loginForm" novalidate>

          <!-- Email field -->
          <div class="form-group">
            <label class="form-label" for="email">Work Email</label>
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              placeholder="name@company.com"
              autocomplete="username"
              required
            >
            <div class="invalid-feedback">
              Please enter a valid work email.
            </div>
          </div>

          <!-- Password field with toggle -->
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="password-wrap">
              <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                minlength="6"
                required
              >
              <button
                type="button"
                class="toggle-password"
                id="togglePassword"
                aria-label="Show password"
              >
                <i class="fas fa-eye"></i>
              </button>
            </div>
            <div class="invalid-feedback">
              Please enter your password.
            </div>
          </div>

          <!-- Forgot password -->
          <div class="forgot-row">
            <a href="#" class="forgot-link" id="forgotPassword">Forgot password?</a>
          </div>

          <!-- Submit -->
          <button type="submit" class="btn btn-login" id="loginButton">
            Login
          </button>

        </form>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      &copy; 2026 Designed &amp; Developed by <strong>Data Science</strong>
    </footer>

  </main>

  <!-- Bootstrap 4 JS bundle -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</html>
